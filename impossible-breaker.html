<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常識破壊エンジン</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #2a2a3a;
    --accent: #e8c547;
    --accent2: #4fc3f7;
    --green: #4caf82;
    --danger: #ff6b6b;
    --text: #e8e8f0;
    --muted: #6b6b8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,197,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,197,71,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }

  header { margin-bottom: 32px; }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 { font-size: clamp(20px, 5.5vw, 30px); font-weight: 700; line-height: 1.2; }
  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    font-weight: 300;
    line-height: 1.6;
  }

  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .input-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    line-height: 1.7;
    padding: 8px 0;
    resize: none;
    outline: none;
    min-height: 72px;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-bottom-color: var(--accent); }

  .btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.2s;
  }
  .btn:hover:not(:disabled) { background: #f0d060; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ex-chip {
    font-size: 11px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 1px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Space Mono', monospace;
  }
  .ex-chip:hover { border-color: var(--accent); color: var(--accent); }

  #output { display: none; }

  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── カード ── */
  .reason-card {
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .reason-card.visible { opacity: 1; transform: translateY(0); }

  /* 壁（不可能の理由） */
  .wall {
    background: var(--surface);
    padding: 14px 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
  }
  .wall-num {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--danger);
    background: rgba(255,107,107,0.1);
    padding: 2px 7px;
    border-radius: 1px;
    white-space: nowrap;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .wall-text { font-size: 14px; line-height: 1.6; font-weight: 700; color: #ccc; }

  /* 反証 */
  .refute {
    padding: 12px 16px;
    background: rgba(79,195,247,0.04);
    border-bottom: 1px solid var(--border);
  }
  .block-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .block-label.blue { color: var(--accent2); }
  .block-label.green { color: var(--green); }
  .block-label.yellow { color: var(--accent); }

  .refute-text { font-size: 13px; line-height: 1.8; font-weight: 300; }
  .example-tag {
    display: inline-block;
    margin-top: 7px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    background: rgba(79,195,247,0.08);
    padding: 2px 8px;
    border-radius: 1px;
  }

  /* 解決策 */
  .solution {
    padding: 12px 16px;
    background: rgba(76,175,130,0.05);
  }
  .solution-text { font-size: 13px; line-height: 1.8; font-weight: 300; color: #c8eedd; }
  .solution-steps {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .step {
    font-size: 12px;
    color: var(--green);
    font-family: 'Space Mono', monospace;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
  }
  .step::before { content: '→'; flex-shrink: 0; }

  /* 突破口 */
  .summary-box {
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 20px;
    margin-top: 8px;
    background: rgba(232,197,71,0.04);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .summary-box.visible { opacity: 1; transform: translateY(0); }
  .summary-box .section-title { color: var(--accent); }
  .summary-box .section-title::after { background: rgba(232,197,71,0.3); }
  .summary-text { font-size: 14px; line-height: 1.9; font-weight: 300; }

  /* ローディング */
  .loading { text-align: center; padding: 40px 0; display: none; }
  .loading-dots { display: inline-flex; gap: 6px; }
  .loading-dots span {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%,80%,100% { opacity:0.2; transform:scale(0.8); }
    40% { opacity:1; transform:scale(1); }
  }
  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Paradigm Breaker</div>
    <h1>「不可能」の<span>突破</span>エンジン</h1>
    <p class="subtitle">壁を列挙し、反証し、<strong style="color:var(--green);font-weight:400;">解決策</strong>まで導きます。</p>
  </header>

  <div class="input-section">
    <span class="input-label">// 挑戦したいテーマ・アイデア</span>
    <textarea id="themeInput" placeholder="例：宇宙に行ける飛行機" rows="3"></textarea>
    <div class="examples">
      <div class="ex-chip" onclick="setExample('宇宙に行ける飛行機')">宇宙に行ける飛行機</div>
      <div class="ex-chip" onclick="setExample('砂漠を農地に変える')">砂漠を農地に</div>
      <div class="ex-chip" onclick="setExample('病院のない地域で高度な手術を行う')">遠隔手術</div>
      <div class="ex-chip" onclick="setExample('人間が150年健康に生きる')">150年健康寿命</div>
    </div>
    <button class="btn" id="analyzeBtn" onclick="analyze()">突破口を探す →</button>
  </div>

  <div id="output">
    <div class="loading" id="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div class="loading-text">常識を解体中...</div>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
// ── データ ─────────────────────────────────────────────────────────

        steps: ["規制の最も厳しくない国・地域を調査して実証フィールドを選定", "小規模実証→データ収集→規制当局との対話を繰り返す", "実績データに基づいた規制提案"]
      },
      {
        wall: "前例がなく、誰も成功したことがない",
        refutation: "前例のなさは不可能の証明ではなく『まだ誰も試みていない』に過ぎない。先行者利益を独占できる最大のチャンスでもある。",
        example: "ホンダ P2：1996年に世界初の自律二足歩行ロボットを実現。『不可能』を塗り替えた",
        solution: "失敗コストを最小化しながら高速で実験を繰り返す『小さく試す』戦略を採用する。",
        steps: ["最小構成のプロトタイプを最短で作り仮説を検証", "失敗から学んだ知見を次のプロトタイプに反映", "実証データが蓄積したら一気にスケール"]
      },
      {
        wall: "既存の業界プレイヤーの抵抗で市場に参入できない",
        refutation: "既存プレイヤーが守ろうとするのは現在のビジネスモデル。全く異なるアーキテクチャで参入すれば、彼らの強みは弱みに変わる。",
        example: "Tesla：ディーラー不要のD2C販売で既存自動車業界の流通コストを無効化",
        solution: "既存プレイヤーが『参入する理由がない』マーケットセグメントを見つけ、そこを拠点に拡大する。",
        steps: ["既存プレイヤーが軽視しているセグメントを特定", "そこで圧倒的な価値を提供し、強固な橋頭堡を築く", "実績と資本を蓄えてからメインストリーム進出"]
      }
    ],
    breakthrough: `「${theme}」の核心的突破口は、"なぜ不可能とされているか"の前提そのものを問い直すことにある。制約は『物理的制約』と『慣習・規制』に分けて考え、後者は変えられることを認識することが突破のカギである。`
  };
}

function setExample(text) {
  document.getElementById('themeInput').value = text;
}

function getData(theme) {
  for (const key of Object.keys(SPECIFIC)) {
    if (theme.includes(key)) return { theme, ...SPECIFIC[key] };
  }
  return defaultData(theme);
}

function analyze() {
  const theme = document.getElementById('themeInput').value.trim();
  if (!theme) return;

  const btn = document.getElementById('analyzeBtn');
  const output = document.getElementById('output');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  btn.disabled = true;
  output.style.display = 'block';
  loading.style.display = 'block';
  results.innerHTML = '';

  setTimeout(() => {
    const data = getData(theme);
    loading.style.display = 'none';
    render(data);
    btn.disabled = false;
  }, 1400);
}

function render(data) {
  const results = document.getElementById('results');
  let html = '<div class="section-title">壁 → 反証 → 解決策</div>';

  data.reasons.forEach((item, i) => {
    const stepsHtml = item.steps.map(s => `<div class="step">${s}</div>`).join('');
    html += `
    <div class="reason-card" id="card${i}">
      <div class="wall">
        <span class="wall-num">壁 ${String(i+1).padStart(2,'0')}</span>
        <span class="wall-text">${item.wall}</span>
      </div>
      <div class="refute">
        <div class="block-label blue">// 反証</div>
        <div class="refute-text">${item.refutation}</div>
        <div class="example-tag">実例 → ${item.example}</div>
      </div>
      <div class="solution">
        <div class="block-label green">// 解決策</div>
        <div class="solution-text">${item.solution}</div>
        <div class="solution-steps">${stepsHtml}</div>
      </div>
    </div>`;
  });

  html += `
  <div class="summary-box" id="summaryBox">
    <div class="section-title">核心的突破口</div>
    <div class="summary-text">${data.breakthrough}</div>
  </div>`;

  results.innerHTML = html;

  data.reasons.forEach((_, i) => {
    setTimeout(() => {
      const el = document.getElementById('card' + i);
      if (el) el.classList.add('visible');
    }, i * 180);
  });

  setTimeout(() => {
    const el = document.getElementById('summaryBox');
    if (el) el.classList.add('visible');
  }, data.reasons.length * 180 + 200);
}

document.getElementById('themeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) analyze();
});
</script>
</body>
</html>
