<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMIDAS — はみ出す思考エンジン</title>
<style>
  :root{
    --paper:#F4F2EA;
    --ink:#1B1A17;
    --shu:#CE3B2E;      /* 朱 — はみ出しの妙所 */
    --ai:#274A6D;       /* 藍 — 枠内 */
    --grid:#D9D4C6;
    --line:#C2BCAC;
    --mut:#756F62;
    --paper2:#ECE9DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,
      var(--paper);
    background-blend-mode:multiply;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:38px 22px 80px;}

  /* ---- header / wordmark signature ---- */
  header{margin-bottom:30px;}
  .frame{
    position:relative;
    border:1.5px solid var(--ink);
    padding:18px 20px 16px;
    background:var(--paper);
  }
  .frame .label{
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:11px;letter-spacing:.22em;color:var(--mut);
    text-transform:uppercase;margin:0 0 6px;
  }
  .frame .sub{font-size:14px;color:var(--ink);margin:0;max-width:46ch;}
  .wordmark{
    position:absolute;top:-26px;right:-6px;
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-weight:700;font-size:clamp(34px,8vw,58px);
    letter-spacing:.02em;line-height:1;color:var(--ink);
    background:var(--paper);padding:2px 4px;
  }
  .wordmark .spill{color:var(--shu);}
  @media(max-width:520px){
    .wordmark{position:static;display:inline-block;margin:0 0 8px;top:auto;right:auto;}
  }

  /* ---- input ---- */
  .ask{margin:34px 0 8px;}
  textarea{
    width:100%;min-height:84px;resize:vertical;
    border:1.5px solid var(--ink);background:var(--paper);
    padding:14px 16px;font:inherit;font-size:16px;color:var(--ink);
    outline:none;
  }
  textarea:focus{box-shadow:0 0 0 3px rgba(39,74,109,.18);}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;}
  button.go{
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:14px;letter-spacing:.12em;font-weight:700;
    background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);
    padding:12px 26px;cursor:pointer;transition:transform .12s,background .2s;
  }
  button.go:hover:not(:disabled){background:var(--shu);border-color:var(--shu);}
  button.go:active:not(:disabled){transform:translateY(1px);}
  button.go:disabled{opacity:.45;cursor:wait;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-size:12.5px;color:var(--ai);background:transparent;
    border:1px dashed var(--line);padding:5px 11px;cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .chip:hover{border-color:var(--ai);}

  /* ---- status ---- */
  .status{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mut);margin:22px 2px;min-height:18px;}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--shu);margin-right:8px;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  .err{color:var(--shu);}
  .diag{display:none;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--shu);padding:12px 14px;margin:0 0 8px;max-height:300px;overflow:auto;}

  /* ---- output ---- */
  #out{margin-top:14px;display:none;}
  .eyebrow{
    font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mut);margin:30px 0 10px;
    display:flex;align-items:center;gap:10px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line);}

  .boundaries{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .btag{font-size:12.5px;color:var(--ai);border:1px solid var(--ai);border-radius:2px;padding:3px 10px;background:rgba(39,74,109,.05);}

  .baseline{
    border-left:3px solid var(--ai);background:var(--paper);
    padding:14px 18px;font-size:15px;
  }

  /* ---- map ---- */
  .map-wrap{background:var(--paper);border:1.5px solid var(--ink);padding:10px 8px 4px;}
  svg{display:block;width:100%;height:auto;}
  .pt{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center;}
  .pt:hover{transform:scale(1.25);}
  .pt circle{stroke:var(--paper);stroke-width:1.5;}
  .pt text{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;fill:var(--paper);}
  .pop-in{animation:popin .4s cubic-bezier(.2,1.3,.4,1) backwards;}
  @keyframes popin{from{opacity:0;transform:scale(0);}to{opacity:1;}}

  /* ---- cards ---- */
  .cards{display:grid;gap:12px;margin-top:6px;}
  .card{
    border:1px solid var(--line);background:var(--paper);
    padding:14px 16px;transition:border-color .2s,box-shadow .2s;
  }
  .card.hot{border-color:var(--shu);}
  .card.flash{box-shadow:0 0 0 3px rgba(206,59,46,.22);}
  .card .top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .card .num{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;color:var(--paper);background:var(--ink);padding:1px 8px;}
  .card.hot .num{background:var(--shu);}
  .card .title{font-weight:700;font-size:16px;}
  .card .relaxed{font-size:12.5px;color:var(--mut);margin-bottom:8px;}
  .card .relaxed b{color:var(--ai);font-weight:600;}
  .card .idea{font-size:15px;margin:0 0 10px;}
  .card .sw{font-size:14px;color:var(--ink);border-top:1px dashed var(--line);padding-top:9px;}
  .card .sw b{color:var(--shu);}
  .metrics{display:flex;gap:18px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mut);margin-top:9px;}
  .metrics b{color:var(--ink);font-size:13px;}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="frame">
      <span class="wordmark">HAMID<span class="spill">AS</span></span>
      <p class="label">disciplined overflow engine</p>
      <p class="sub">問いが暗黙に引いている枠を見つけ、制約をひとつだけ外す。隣の一歩のはみ出しに、予想より不可能に見える価値を探す装置。</p>
    </div>
  </header>

  <div class="ask">
    <textarea id="q" placeholder="問いを入力（例：個人で軽飛行機を設計するには？）"></textarea>
    <div class="row">
      <button class="go" id="go">はみ出す</button>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <pre class="diag" id="diag"></pre>

  <div id="out">
    <div class="eyebrow">枠 — この問いが前提していること</div>
    <div class="boundaries" id="bnd"></div>

    <div class="eyebrow">枠内の回答</div>
    <div class="baseline" id="base"></div>

    <div class="eyebrow">はみ出しマップ</div>
    <div class="map-wrap"><svg id="map" viewBox="0 0 400 400" role="img" aria-label="はみ出し案の散布図"></svg></div>

    <div class="eyebrow">はみ出し案</div>
    <div class="cards" id="cards"></div>
  </div>

</div>

<script>
const EXAMPLES = [
  "個人で軽飛行機を設計するには？",
  "蔵書360冊をどう活かすか？",
  "二輪事業の利益率を上げるには？"
];
const chipsEl = document.getElementById('chips');
EXAMPLES.forEach(t=>{
  const c=document.createElement('button');
  c.className='chip';c.textContent=t;
  c.onclick=()=>{document.getElementById('q').value=t;run();};
  chipsEl.appendChild(c);
});

const $=id=>document.getElementById(id);
const goBtn=$('go'), statusEl=$('status');

function setStatus(msg,err){
  statusEl.innerHTML = msg ? (err?`<span class="err">${msg}</span>`:`<span class="dot"></span>${msg}`) : '';
}

const SYS = `あなたは「HAMIDAS」エンジン。ユーザーの問いに対し、規律あるはみ出し（disciplined overflow）を行う。
手順:
1. boundaries: その問いが暗黙に前提している制約を2つ、短い名詞句で抽出。
2. baseline: 枠内の標準的回答を2文で簡潔に。
3. ideas: 制約を「ひとつだけ」外したはみ出し案を4つ。各案は無限遠でなく隣接可能（隣の一歩）であること。
各ideaは {title:8字程度の名, relaxed:外した制約, idea:案を1文, implausibility:0-100の整数(不可能に見える度), value:0-100の整数(潜在価値), so_what:はみ出した部分の価値を1文} 。
implausibilityが高く valueも高い案ほど価値が高い。
出力はJSONのみ。前置き・説明・コードフェンス一切禁止。すべて日本語。簡潔に。
形式: {"boundaries":[..],"baseline":"..","ideas":[{...}]}`;

function lenientParse(raw){
  let t = raw.replace(/```json/gi,'').replace(/```/g,'').trim();
  try { return JSON.parse(t); } catch(e){}
  // salvage: flat objects + fields
  const out={boundaries:[],baseline:'',ideas:[]};
  const bm = t.match(/"baseline"\s*:\s*"([^"]*)"/);
  if(bm) out.baseline=bm[1];
  const ba = t.match(/"boundaries"\s*:\s*\[([^\]]*)\]/);
  if(ba) out.boundaries=ba[1].split(',').map(s=>s.replace(/^[^"]*"|"[^"]*$/g,'').replace(/"/g,'').trim()).filter(Boolean);
  const objs = t.match(/\{[^{}]*"title"[^{}]*\}/g)||[];
  objs.forEach(o=>{ try{ out.ideas.push(JSON.parse(o)); }catch(_){} });
  if(!out.ideas.length) throw new Error('parse_failed');
  return out;
}

let lastDiag='';
function showDiag(){ const d=$('diag'); if(lastDiag){ d.style.display='block'; d.textContent=lastDiag; } }

async function run(){
  const q = $('q').value.trim();
  if(!q){ setStatus('問いを入力してください',true); return; }
  goBtn.disabled=true; $('out').style.display='none'; $('diag').style.display='none'; lastDiag='';
  setStatus('枠を見つけ、はみ出しを探しています…');
  let stage='接続';
  try{
    let res;
    try{
      res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          messages:[{role:"user",content:SYS+"\n\n----\n問い："+q}]
        })
      });
    }catch(fe){
      lastDiag='[接続段階で例外]\n'+fe.name+': '+fe.message+
        '\n\nこの段階で落ちる場合、ページがClaudeアプリ内のアーティファクトとして実行されておらず、AIブリッジが注入されていない可能性が高いです（モバイルのファイルプレビュー等）。チャット内のプレビューで開いて再試行してください。';
      throw new Error('接続失敗 / '+fe.message);
    }
    stage='HTTP';
    const raw = await res.text();
    lastDiag = '[HTTP '+res.status+']\n'+raw.slice(0,1400);
    if(!res.ok) throw new Error('HTTP '+res.status);
    stage='JSON';
    let data;
    try{ data = JSON.parse(raw); }
    catch(je){ throw new Error('応答がJSONではありません'); }
    if(data && data.type==='error'){ throw new Error('APIエラー: '+((data.error&&data.error.message)||'不明')); }
    stage='抽出';
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    if(!text){ lastDiag='[contentからテキストを抽出できません]\n'+JSON.stringify(data).slice(0,1400); throw new Error('テキストが空'); }
    stage='解釈';
    const parsed = lenientParse(text);
    render(parsed);
    setStatus('');
  }catch(err){
    setStatus('はみ出せませんでした ['+stage+'段階]：'+err.message+' — 下の診断ログを確認してください。',true);
    showDiag();
  }finally{
    goBtn.disabled=false;
  }
}
goBtn.onclick=run;
$('q').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') run(); });

/* ---------- render ---------- */
function render(d){
  // boundaries
  const bnd=$('bnd'); bnd.innerHTML='';
  (d.boundaries||[]).forEach(b=>{ const s=document.createElement('span'); s.className='btag'; s.textContent='枠：'+b; bnd.appendChild(s); });
  // baseline
  $('base').textContent = d.baseline||'';
  // map + cards
  const ideas=(d.ideas||[]).map((it,i)=>({
    i, title:it.title||('案'+(i+1)),
    relaxed:it.relaxed||'', idea:it.idea||'',
    p:clamp(it.implausibility), v:clamp(it.value), sw:it.so_what||''
  }));
  drawMap(ideas);
  drawCards(ideas);
  $('out').style.display='block';
  $('out').scrollIntoView({behavior:'smooth',block:'start'});
}
function clamp(n){ n=parseInt(n); if(isNaN(n))n=50; return Math.max(0,Math.min(100,n)); }

function drawMap(ideas){
  const W=400,P=44, x0=P, x1=W-P, y0=W-P, y1=P, span=x1-x0;
  const fx=p=>x0 + p/100*span;
  const fy=v=>y0 - v/100*span;
  const mid=fx(50), midy=fy(50);
  let s='';
  // sweet-spot quadrant (朱)
  s+=`<rect x="${mid}" y="${y1}" width="${x1-mid}" height="${midy-y1}" fill="#CE3B2E" opacity="0.09"/>`;
  // fine grid
  for(let g=10;g<100;g+=10){
    s+=`<line x1="${fx(g)}" y1="${y1}" x2="${fx(g)}" y2="${y0}" stroke="#D9D4C6" stroke-width="1"/>`;
    s+=`<line x1="${x0}" y1="${fy(g)}" x2="${x1}" y2="${fy(g)}" stroke="#D9D4C6" stroke-width="1"/>`;
  }
  // mid lines
  s+=`<line x1="${mid}" y1="${y1}" x2="${mid}" y2="${y0}" stroke="#C2BCAC" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  s+=`<line x1="${x0}" y1="${midy}" x2="${x1}" y2="${midy}" stroke="#C2BCAC" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  // frame (枠)
  s+=`<rect x="${x0}" y="${y1}" width="${span}" height="${span}" fill="none" stroke="#1B1A17" stroke-width="1.5"/>`;
  // sweet-spot label
  s+=`<text x="${x1-6}" y="${y1+16}" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#CE3B2E" font-weight="700">妙所</text>`;
  // axis labels
  s+=`<text x="${(x0+x1)/2}" y="${y0+30}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#756F62">不可能に見える度 →</text>`;
  s+=`<text x="${x0-30}" y="${(y0+y1)/2}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#756F62" transform="rotate(-90 ${x0-30} ${(y0+y1)/2})">潜在価値 ↑</text>`;
  // points
  ideas.forEach((d,k)=>{
    const cx=fx(d.p), cy=fy(d.v), hot=(d.p>50&&d.v>50);
    s+=`<g class="pt pop-in" data-i="${d.i}" style="animation-delay:${k*70}ms" tabindex="0">
          <circle cx="${cx}" cy="${cy}" r="11" fill="${hot?'#CE3B2E':'#1B1A17'}"/>
          <text x="${cx}" y="${cy+4}" text-anchor="middle">${d.i+1}</text>
        </g>`;
  });
  const map=$('map'); map.innerHTML=s;
  map.querySelectorAll('.pt').forEach(g=>{
    const i=g.getAttribute('data-i');
    g.onclick=()=>flashCard(i);
    g.onkeydown=e=>{ if(e.key==='Enter') flashCard(i); };
  });
}

function drawCards(ideas){
  const wrap=$('cards'); wrap.innerHTML='';
  ideas.forEach(d=>{
    const hot=(d.p>50&&d.v>50);
    const el=document.createElement('div');
    el.className='card'+(hot?' hot':''); el.id='card-'+d.i;
    el.innerHTML=`
      <div class="top"><span class="num">${d.i+1}</span><span class="title">${esc(d.title)}</span></div>
      <div class="relaxed">外した枠：<b>${esc(d.relaxed)}</b></div>
      <p class="idea">${esc(d.idea)}</p>
      <div class="sw"><b>はみ出しの価値：</b>${esc(d.sw)}</div>
      <div class="metrics"><span>不可能度 <b>${d.p}</b></span><span>潜在価値 <b>${d.v}</b></span></div>`;
    el.onmouseenter=()=>{ const pt=document.querySelector('.pt[data-i="'+d.i+'"] circle'); if(pt) pt.setAttribute('r','14'); };
    el.onmouseleave=()=>{ const pt=document.querySelector('.pt[data-i="'+d.i+'"] circle'); if(pt) pt.setAttribute('r','11'); };
    wrap.appendChild(el);
  });
}

function flashCard(i){
  const c=$('card-'+i); if(!c) return;
  c.scrollIntoView({behavior:'smooth',block:'center'});
  c.classList.add('flash');
  setTimeout(()=>c.classList.remove('flash'),900);
}

function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
</script>
</body>
</html>
