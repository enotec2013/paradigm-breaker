<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常識破壊エンジン</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');
  :root {
    --bg: #0a0a0f; --surface: #111118; --border: #2a2a3a;
    --accent: #e8c547; --accent2: #4fc3f7; --green: #4caf82;
    --danger: #ff6b6b; --text: #e8e8f0; --muted: #6b6b8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Serif JP', serif; min-height: 100vh; padding: 24px 16px 60px; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(232,197,71,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,197,71,0.03) 1px,transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .wrap { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
  header { margin-bottom: 32px; }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: clamp(20px,5.5vw,30px); font-weight: 700; line-height: 1.2; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 300; line-height: 1.6; }
  .input-section { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 20px; margin-bottom: 24px; }
  .input-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--accent2); text-transform: uppercase; margin-bottom: 10px; display: block; }
  textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-family: 'Noto Serif JP', serif; font-size: 15px; line-height: 1.7; padding: 8px 0; resize: none; outline: none; min-height: 72px; }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-bottom-color: var(--accent); }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 14px; background: var(--accent); color: #0a0a0f; border: none; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; border-radius: 1px; transition: all 0.2s; }
  .btn:hover:not(:disabled) { background: #f0d060; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ex-chip { font-size: 11px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 1px; color: var(--muted); cursor: pointer; transition: all 0.2s; font-family: 'Space Mono', monospace; }
  .ex-chip:hover { border-color: var(--accent); color: var(--accent); }
  #output { display: none; }
  .section-title { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .reason-card { border: 1px solid var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden; opacity: 0; transform: translateY(14px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .reason-card.visible { opacity: 1; transform: translateY(0); }
  .wall { background: var(--surface); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--border); }
  .wall-num { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--danger); background: rgba(255,107,107,0.1); padding: 2px 7px; border-radius: 1px; white-space: nowrap; margin-top: 3px; flex-shrink: 0; }
  .wall-text { font-size: 14px; line-height: 1.6; font-weight: 700; color: #ccc; }
  .refute { padding: 12px 16px; background: rgba(79,195,247,0.04); border-bottom: 1px solid var(--border); }
  .block-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
  .block-label.blue { color: var(--accent2); }
  .block-label.green { color: var(--green); }
  .refute-text { font-size: 13px; line-height: 1.8; font-weight: 300; }
  .example-tag { display: inline-block; margin-top: 7px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent2); background: rgba(79,195,247,0.08); padding: 2px 8px; border-radius: 1px; }
  .solution { padding: 12px 16px; background: rgba(76,175,130,0.05); }
  .solution-text { font-size: 13px; line-height: 1.8; font-weight: 300; color: #c8eedd; }
  .solution-steps { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .step { font-size: 12px; color: var(--green); font-family: 'Space Mono', monospace; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
  .step::before { content: '→'; flex-shrink: 0; }
  .summary-box { border: 1px solid var(--accent); border-radius: 2px; padding: 20px; margin-top: 8px; background: rgba(232,197,71,0.04); opacity: 0; transform: translateY(14px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .summary-box.visible { opacity: 1; transform: translateY(0); }
  .summary-box .section-title { color: var(--accent); }
  .summary-box .section-title::after { background: rgba(232,197,71,0.3); }
  .summary-text { font-size: 14px; line-height: 1.9; font-weight: 300; }
  .loading { text-align: center; padding: 40px 0; display: none; }
  .loading-dots { display: inline-flex; gap: 6px; }
  .loading-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1)} }
  .loading-text { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-top: 12px; }
  .no-match { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 20px; font-size: 13px; color: var(--muted); line-height: 1.8; }
  .no-match strong { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Paradigm Breaker</div>
    <h1>「不可能」の<span>突破</span>エンジン</h1>
    <p class="subtitle">壁を列挙し、反証し、<strong style="color:var(--green);font-weight:400;">解決策</strong>まで導きます。</p>
  </header>
  <div class="input-section">
    <span class="input-label">// 挑戦したいテーマ・アイデア</span>
    <textarea id="themeInput" placeholder="例：宇宙に行ける飛行機、砂漠の農業、遠隔手術…" rows="3"></textarea>
    <div class="examples">
      <div class="ex-chip" onclick="setExample('宇宙に行ける飛行機')">宇宙×飛行機</div>
      <div class="ex-chip" onclick="setExample('砂漠を農地に変える')">砂漠農業</div>
      <div class="ex-chip" onclick="setExample('病院のない地域で手術する')">遠隔手術</div>
      <div class="ex-chip" onclick="setExample('核融合発電を実用化する')">核融合</div>
      <div class="ex-chip" onclick="setExample('人間が150年健康に生きる')">超長寿</div>
      <div class="ex-chip" onclick="setExample('海水から飲料水を作る')">海水淡水化</div>
      <div class="ex-chip" onclick="setExample('自動車を空飛ぶ車にする')">空飛ぶ車</div>
      <div class="ex-chip" onclick="setExample('プラスチックごみをゼロにする')">脱プラ</div>
    </div>
    <button class="btn" id="analyzeBtn" onclick="analyze()">突破口を探す →</button>
  </div>
  <div id="output">
    <div class="loading" id="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div class="loading-text">常識を解体中...</div>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
const DB = {
  宇宙: {
    reasons: [
      { wall:"大気圏突破に必要な速度（秒速7.9km）を飛行機エンジンでは出せない", refutation:"スクラムジェットはマッハ5以上で作動し、空中発射方式なら飛行機は「動く発射台」として機能すれば十分。全速を飛行機一機で賄う必要はない。", example:"Virgin Galactic：母機から切り離しロケット点火、高度86kmへ到達", solution:"飛行機＋ロケットの2段式設計。飛行機は高度15kmまで担当、そこからロケットが引き継ぐ。", steps:["高度15kmまで飛行機で上昇（燃料消費を大幅削減）","分離後にロケットエンジン点火（必要Δvを60%削減）","帰還時は翼で滑空着陸（完全再利用可能）"] },
      { wall:"機体構造が宇宙空間の真空・極端な温度差に耐えられない", refutation:"断熱セラミックタイルとCFRP複合材は宇宙往還機で実証済み。スペースシャトルは翼を持つ宇宙機として30年運用された。", example:"X-37B：翼付き無人宇宙機が780日以上の軌道滞在を達成", solution:"機体素材をセラミック断熱タイル＋CFRP複合材に刷新し、宇宙空間を飛ぶ「航空機」として再設計する。", steps:["機首・前縁部にセラミックタイル（耐熱1650℃）を適用","機体構造をCFRP製にして軽量化と剛性を両立","与圧キャビンを独立した宇宙船モジュールとして設計"] },
      { wall:"燃料搭載量が飛行機の積載限界を超える", refutation:"高高度・高速状態での点火は必要Δvを大幅削減できる。液体水素は同重量で従来燃料の2.5倍のエネルギーを持つ。", example:"ストラトローンチ：翼幅117mの世界最大機から宇宙ロケットを空中発射", solution:"液体水素エンジンと空中発射を組み合わせ、地上発射比で燃料を40%削減する。", steps:["液体水素／液体酸素エンジンを採用（比推力450秒）","空中発射で大気の濃い層を飛行機が通過","軌道上燃料補給システムを将来オプションとして設計"] },
      { wall:"宇宙飛行士の安全確保が航空安全基準と相容れない", refutation:"飛行機型は緊急時に大気圏内で通常着陸できる。ロケットより中止判断のウィンドウが広く、安全性で勝る側面もある。", example:"スペースシャトル135回飛行：有翼設計で緊急帰還ルートを複数確保", solution:"フライトアボートシステムを航空機基準で設計し、各フェーズに独立した緊急帰還手順を持たせる。", steps:["低高度フェーズ：エンジン停止→翼で滑空着陸","ロケット点火後：分離キャプセルによる緊急脱出","軌道上：再突入カプセルを独立モジュールとして常時待機"] },
      { wall:"開発コストが国家規模になり民間では資金調達できない", refutation:"SpaceXがファルコン9を数千億円で開発したように、官民連携と反復設計でコスト削減が可能。宇宙観光市場は2030年代に1兆円規模と試算される。", example:"SpaceX：ファルコン9再利用で打ち上げコストを1/10に削減", solution:"段階的に市場を拡大し、収益で開発費を回収するロードマップを設計する。", steps:["Phase1：高高度遊覧飛行（高度20km）で観光収益を確保","Phase2：準軌道飛行（高度100km）で宇宙観光市場を開拓","Phase3：軌道投入能力を追加し衛星打ち上げ市場へ参入"] }
    ],
    breakthrough:"「宇宙に行ける飛行機」の核心は、飛行機とロケットを競合ではなく協業として設計すること。飛行機の再利用性・空港インフラ・段階的上昇という強みを活かし、ロケットの高速加速と組み合わせる2段式アーキテクチャが現実解。Virgin GalacticとStratolaunchはすでに実証段階にある。"
  },

  砂漠: {
    reasons: [
      { wall:"水が極端に少なく農業用灌漑が不可能", refutation:"海水淡水化コストは過去20年で80%以上低下。太陽光発電と組み合わせれば砂漠沿岸部では無尽蔵の真水が作れる。", example:"イスラエル：国土60%が砂漠でも点滴灌漑で農業輸出国に転換", solution:"太陽光発電所と逆浸透膜淡水化プラントを砂漠沿岸に併設し農業用水を自給する。", steps:["太陽光パネルで電力を自給（砂漠の日照は年2500時間以上）","余剰電力で海水淡水化（逆浸透膜）を稼働","点滴灌漑で水使用量を露地栽培の30%以下に抑制"] },
      { wall:"土壌が痩せていて作物が育たない", refutation:"水耕・養液栽培やバイオチャーで砂に保水性を付与する技術が実証済み。砂漠は病害虫が少なく制御環境農業に適している。", example:"UAE：砂漠の垂直農場で土なしレタス・ハーブを年中量産", solution:"屋内垂直農場＋砂地へのバイオチャー混合の2トラック戦略で土壌問題を回避する。", steps:["短期：垂直農場で葉物野菜・ハーブを収益化","中期：砂にバイオチャー＋微生物を混合し土壌を育成","長期：外気露地栽培に移行し大規模穀物生産へ"] },
      { wall:"昼間55℃超の高温で作物が枯れる", refutation:"高温と表裏一体の豊富な太陽光は発電・冷却の両方に使える。蒸発冷却温室で外気より20℃低い栽培環境を作れる。", example:"サハラフォレスト・プロジェクト：チュニジア砂漠で太陽熱冷却温室を実証", solution:"遮光ネット＋蒸発冷却の「パッシブ冷却温室」を建設し適切な栽培環境を作る。", steps:["遮光ネット（遮光率50%）で直射日光を遮断","湿らせた多孔質素材を通じた蒸発冷却で気温を下げる","温室内CO₂を濃縮し光合成を促進（収量1.5倍）"] },
      { wall:"砂嵐で施設・設備が破壊される", refutation:"防砂林・半地下構造・流線形設計で砂嵐の影響を最小化でき、風力発電の電力源として活用できる。", example:"中国・クブチ砂漠：30年の植林で6000km²を緑地化・農地化", solution:"農場外周に防砂林を植え施設を半地下構造にして風荷重を90%削減する。", steps:["外周3列の砂防林（ポプラ・タマリスク）を先行植栽","主要施設を地表より1.5m掘り下げた半地下構造で建設","風向を計算した流線形屋根で砂の堆積を防ぐ"] },
      { wall:"輸送インフラが整っておらず出荷コストが採算を上回る", refutation:"砂漠は既存インフラの制約がなく一から設計できる。高付加価値・軽量農産品に特化すれば輸送コスト問題を回避できる。", example:"モロッコ：サハラ砂漠の太陽光で発電し欧州へ電力輸出、インフラ問題を逆転", solution:"まず高付加価値・軽量農産物に特化し輸送コストを収益で吸収できる品目から参入する。", steps:["Phase1：サフラン・高級ハーブなど1kgあたり1万円超の品目に集中","Phase2：収益で道路・冷蔵輸送インフラを整備","Phase3：穀物・野菜の大量生産へ拡大"] }
    ],
    breakthrough:"砂漠農業の突破口は「弱点を克服する」発想を捨て「強みを活かす」設計にある。豊富な太陽光・病害虫の少なさ・広大な安価な土地という強みを活かし、水だけ解決すれば世界最高の農業地帯になる。太陽光発電＋海水淡水化＋垂直農場の三位一体が現実解。"
  },

  手術: {
    reasons: [
      { wall:"遠隔では手の微細な動きが正確に伝わらない", refutation:"ロボット手術システムは人間の手の震えを除去し0.1mm精度で動作する。5G通信で遅延は1ms以下まで短縮されており、熟練外科医の動作を完全に再現できる。", example:"ダヴィンチ手術システム：世界で年間100万件以上の遠隔支援手術を実施", solution:"ハプティクス（力覚フィードバック）搭載の手術ロボットと5G専用回線を組み合わせる。", steps:["5G専用回線で遅延1ms以下の通信環境を確保","ハプティクス技術で触覚・圧力感覚をリアルタイム伝送","AIが通信遅延を予測補正し動作の連続性を保証"] },
      { wall:"緊急事態に即座に対応できない", refutation:"現地に補助スタッフと手術ロボットを配置すれば、遠隔医師が指示を出しながら実施できる。地方の医師がオンライン指導を受ける「ハイブリッド手術」は既に実用化されている。", example:"NASA：宇宙ステーション内での遠隔医療処置プロトコルを確立", solution:"現地に訓練された手術アシスタントとロボットを常備し、遠隔専門医とのハイブリッド体制を構築する。", steps:["現地に手術アシスタント（PA）とロボット機器を配置","専門医はVRで術野を立体視しながら遠隔操作","緊急時は現地スタッフが自律モードで対応できる訓練を実施"] },
      { wall:"通信障害・停電リスクがある", refutation:"冗長化した通信システムと自動一時停止機能で対応できる。飛行機の自動操縦システムも同様のリスクを克服している。", example:"軍の遠隔手術プログラム：衛星通信3系統冗長化で戦場での手術を実現", solution:"衛星・5G・光ファイバーの3系統冗長化と、緊急停止→現地引き継ぎプロトコルを設計する。", steps:["衛星通信・5G・光ファイバーの3系統を並列運用","通信断絶時はロボットが安全位置へ自動退避","現地アシスタントが即座に引き継げる標準手順を訓練"] },
      { wall:"法規制・医療免許が国境をまたげない", refutation:"テレメディシンの規制緩和は世界的に進んでいる。コロナ禍でオンライン診療が急拡大し、遠隔手術の法整備も各国で始まっている。", example:"EU：越境テレメディシン指令で加盟国間の遠隔医療を合法化", solution:"規制の進んだ国・地域でモデルケースを作り、国際標準として輸出する戦略を取る。", steps:["規制先進国（エストニア・シンガポール等）で先行実証","安全実績データをもとにWHOへ国際標準を提案","二国間協定から始め徐々に適用国を拡大"] },
      { wall:"患者の心理的不安が大きく受け入れられない", refutation:"自動車・飛行機もかつては「機械に命を預けられない」と言われた。実績の積み重ねと透明性のある情報提供で信頼は構築できる。", example:"ロボット手術の合併症率：熟練外科医による手術と同等以下であることが複数研究で実証", solution:"小手術から実績を積み上げ、成功率データを公開することで段階的に信頼を獲得する。", steps:["まず低リスクの内視鏡手術から遠隔支援を開始","全手術データをリアルタイム公開し透明性を確保","患者が手術前に遠隔医師とVRで対面できる仕組みを作る"] }
    ],
    breakthrough:"遠隔手術の突破口は「外科医をどこにでもテレポートさせる」発想にある。5G・ロボティクス・AIの三位一体で、世界最高の外科医の技術をどんな僻地にも届けられる。地理的格差を技術で埋めることが医療の民主化につながる。"
  },

const KEYWORDS = {
  宇宙: ['宇宙','スペース','ロケット','衛星','宇宙船'],
  砂漠: ['砂漠','乾燥','荒野','荒地'],
  手術: ['手術','医療','病院','遠隔','外科','診療'],
  核融合: ['核融合','原子力','エネルギー','発電','核'],
  長寿: ['長寿','寿命','老化','不老','健康','100歳','150歳'],
  淡水: ['淡水','飲料水','水不足','海水','水資源'],
  空飛ぶ: ['空飛ぶ','フライングカー','eVTOL','自動車','車'],
  プラスチック: ['プラスチック','ごみ','廃棄','リサイクル','海洋汚染'],
  教育: ['教育','学校','学習','勉強','授業','AI教育'],
  交通: ['交通','渋滞','自動運転','電気自動車','EV','公共交通','鉄道']
};

function findData(theme) {
  for (const [key, words] of Object.entries(KEYWORDS)) {
    if (words.some(w => theme.includes(w))) {
      return { theme, ...DB[key] };
    }
  }
  return null;
}

function setExample(text) {
  document.getElementById('themeInput').value = text;
}

function analyze() {
  const theme = document.getElementById('themeInput').value.trim();
  if (!theme) return;
  const btn = document.getElementById('analyzeBtn');
  const output = document.getElementById('output');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  btn.disabled = true;
  output.style.display = 'block';
  loading.style.display = 'block';
  results.innerHTML = '';
  setTimeout(() => {
    const data = findData(theme);
    loading.style.display = 'none';
    if (data) {
      render(data);
    } else {
      const keys = Object.values(KEYWORDS).flat().join('・');
      results.innerHTML = `<div class="no-match">
        <strong>対応テーマが見つかりませんでした。</strong><br><br>
        現在対応しているキーワード：<br>${keys}<br><br>
        上記のサンプルボタンからお試しください。
      </div>`;
    }
    btn.disabled = false;
  }, 1400);
}

function render(data) {
  const results = document.getElementById('results');
  let html = '<div class="section-title">壁 → 反証 → 解決策</div>';
  data.reasons.forEach((item, i) => {
    const stepsHtml = item.steps.map(s => `<div class="step">${s}</div>`).join('');
    html += `
    <div class="reason-card" id="card${i}">
      <div class="wall">
        <span class="wall-num">壁 ${String(i+1).padStart(2,'0')}</span>
        <span class="wall-text">${item.wall}</span>
      </div>
      <div class="refute">
        <div class="block-label blue">// 反証</div>
        <div class="refute-text">${item.refutation}</div>
        <div class="example-tag">実例 → ${item.example}</div>
      </div>
      <div class="solution">
        <div class="block-label green">// 解決策</div>
        <div class="solution-text">${item.solution}</div>
        <div class="solution-steps">${stepsHtml}</div>
      </div>
    </div>`;
  });
  html += `
  <div class="summary-box" id="summaryBox">
    <div class="section-title">核心的突破口</div>
    <div class="summary-text">${data.breakthrough}</div>
  </div>`;
  results.innerHTML = html;
  data.reasons.forEach((_, i) => {
    setTimeout(() => {
      const el = document.getElementById('card' + i);
      if (el) el.classList.add('visible');
    }, i * 180);
  });
  setTimeout(() => {
    const el = document.getElementById('summaryBox');
    if (el) el.classList.add('visible');
  }, data.reasons.length * 180 + 200);
}

document.getElementById('themeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) analyze();
});
